spring.datasource.url=${FOLIO_DB_URL:jdbc:postgresql://localhost:5432/folio_uaz}
spring.datasource.username=${FOLIO_DB_USER:folio_uaz}
spring.datasource.password=${FOLIO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${FOLIO_SECURE_COOKIE:false}
